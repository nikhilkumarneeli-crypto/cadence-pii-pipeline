[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "member3-pptx-extractor"
version = "1.0.0"
description = "Cadence Financial Group - Case Study 2: PowerPoint (PPTX) Extraction Engine and Structure Retention Metric"
authors = [
    { name = "Member 3", email = "member3@cadencefg.example" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pytest>=8.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
pptx-extract = "src.pptx_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
